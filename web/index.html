<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1520">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2ecf0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ulak">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <title>Ulak</title>
  <link rel="preload" href="/static/elmessiri.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
</head>
<body>
<main id="app">
  <div id="conn" class="conn" role="status" aria-live="polite" hidden></div>
  <section id="home" class="screen">
    <header class="top">
      <h1><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4h12v12A12 12 0 1 1 16 4z" fill="currentColor"/><path d="M11.5 11.5v5.4a4.2 4.2 0 0 0 8.4 0v-3l4.6-4.6" fill="none" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Ulak</h1>
      <button id="theme" class="icon" data-theme-toggle data-i18n-aria="darkTheme" aria-pressed="true"><svg class="moon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="hilal"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><circle class="bite" cx="16.4" cy="8.6" r="7.2" fill="#000"/></mask></defs><circle class="halo" cx="12" cy="12" r="9.5"/><circle class="disc" cx="12" cy="12" r="8.2" fill="currentColor" mask="url(#hilal)"/></svg></button>
      <button id="history" class="icon" data-i18n-aria="history"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h14v15H5z"/><path d="M8.5 9h7M8.5 12h7M8.5 15h4"/></svg></button>
      <button id="settings" class="icon" data-i18n-aria="settings"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5h9M17 7.5h3M4 16.5h3M11 16.5h9"/><circle cx="15" cy="7.5" r="2"/><circle cx="9" cy="16.5" r="2"/></svg></button>
    </header>
    <div id="summary" class="summary"></div>
    <button id="limits" class="limits" hidden></button>
    <div id="list" class="scroll"><div id="ptr" class="ptr"></div><div id="groups"></div></div>
    <div class="dock">
      <button id="toQuick" class="pill-btn" data-i18n="quickSend"></button>
      <button id="newSession" class="pill-btn primary" data-i18n="newSession"></button>
    </div>
  </section>
  <section id="session" class="screen" hidden>
    <header class="top">
      <button id="back" class="icon" data-i18n-aria="back"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
      <div class="s-title"><b id="sTitle"></b><span id="sSub"></span></div>
      <button id="sMenu" class="icon" data-i18n-aria="menu"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12h.01M12 12h.01M18.5 12h.01"/></svg></button>
    </header>
    <div id="messages" class="scroll msgs"></div>
    <button id="jump" class="jump" hidden>↓ Yeni</button>
    <div id="receipt" class="receipt" role="status" hidden></div>
    <div id="promptZone"></div>
    <div id="keybar" class="keybar" hidden></div>
    <p id="plainNote" class="plain-note" data-i18n="plainPane" hidden></p>
    <form id="composer" class="composer">
      <div id="slashOptions" class="slash-options" role="listbox" aria-label="Slash commands" hidden></div>
      <button type="button" id="keysBtn" class="icon" data-i18n-aria="keys"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7h17v10h-17z"/><path d="M7 10.5h.01M10.5 10.5h.01M14 10.5h.01M17.5 10.5h.01M8 14h8"/></svg></button>
      <button type="button" id="attachBtn" class="icon" data-i18n-aria="attach"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 11.5-7 7a4.5 4.5 0 0 1-6.4-6.4l7.6-7.6a3 3 0 0 1 4.3 4.3L10 16.3a1.5 1.5 0 0 1-2.2-2.1l6.7-6.7"/></svg></button>
      <input type="file" id="fileIn" accept="image/*,application/pdf,text/plain" multiple hidden>
      <textarea id="message" rows="1" data-i18n-ph="composerPh" data-i18n-aria="composerPh" enterkeyhint="send" autocomplete="off"></textarea>
      <button type="submit" id="send" class="send" data-i18n-aria="sendAria"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </form>
  </section>
</main>
<div id="sheetBack" class="sheet-back" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" tabindex="-1" hidden></div>
<div id="promptStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="/static/i18n.js"></script>
<script src="/static/app.js" defer></script>
</body>
</html>
