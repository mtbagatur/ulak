<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a46"/>
      <stop offset="1" stop-color="#101522"/>
    </linearGradient>
    <linearGradient id="u" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb6ff"/>
      <stop offset="1" stop-color="#3f7dff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- U: the messenger's path, down and back up -->
  <path d="M150 148 V286 a106 106 0 0 0 212 0 V148" fill="none" stroke="url(#u)" stroke-width="58" stroke-linecap="round"/>
  <!-- tangerine dot: a message waiting -->
  <circle cx="372" cy="132" r="44" fill="#ff8a3d" stroke="#101522" stroke-width="16"/>
</svg>
